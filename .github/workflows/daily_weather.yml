name: Daily 7AM Weather Agent

on:
  schedule:
    # Runs at 12:00 UTC every day (7:00 AM EST)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual testing anytime from the Actions tab

permissions:
  contents: write # Allows the workflow to commit the updated index.html

jobs:
  run-weather-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Weather Agent & Send Email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python weather_agent.py

      - name: Commit updated web interface
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily weather UI"
          git push
